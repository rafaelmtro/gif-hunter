services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8000"
    environment:
      - GIPHY_API_KEY=${GIPHY_API_KEY}
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    restart: always
