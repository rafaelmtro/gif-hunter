name: GIF Hunter CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run Tests
        working-directory: ./backend
        run: pytest

  frontend-build:
    name: Frontend Build (SwiftWasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftWasm and Carton
        run: |
          npm install -g @swiftwasm/carton
      - name: Build Web Assembly
        working-directory: ./frontend
        run: |
          # Use a Docker image to build the Wasm bundle since we need the SwiftWasm toolchain
          docker run --rm -v ${{ github.workspace }}/frontend:/app -w /app swiftwasm/swift:5.9-focal bash -c "npm install -g @swiftwasm/carton && carton bundle --release"
